<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>妄</title>
<style>
/* film.css */
/* ============================================================
   第 0 天 · 临江三号院
   视觉纪律：2.35:1 画幅 / 三层视差 / 一景一色 / 颗粒 + 暗角
   所有尺寸以 --u 为单位（--u = 画框宽度的 1%），由 JS 注入
   ============================================================ */

:root {
  --ink: #e9e3d7;
  --ink-dim: #9c9488;
  --warm: #d8b47e;
  --black: #050506;
  --u: 8px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  -webkit-font-smoothing: antialiased;
  color: var(--ink);
  user-select: none;
}

#stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at 50% 45%, #0a0a0c 0%, #000 78%);
}

/* ---------- 画框：宽银幕 ---------- */
.frame {
  position: relative;
  width: min(100vw, calc(100dvh * 2.35));
  aspect-ratio: 2.35 / 1;
  max-height: 100dvh;
  overflow: hidden;
  background: #0b0b0c;
  box-shadow: 0 0 calc(var(--u) * 6) rgba(0, 0, 0, .9);
}

/* ---------- 场景容器 ---------- */
#scenes {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 900ms ease;
}
#scenes.on { opacity: 1; }

.scene {
  position: absolute;
  inset: 0;
  display: none;
}
.scene.live {
  display: block;
  opacity: 1;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

/* 每一层都撑出画框外一点，缓推/漂移时不出边 */
.lyr {
  position: absolute;
  inset: -4%;
  will-change: transform, filter;
}

/* ---------- 通用：光斑 / 暗角 / 颗粒 ---------- */
.light-leak {
  position: absolute;
  inset: -6%;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: .46;
  filter: blur(calc(var(--u) * 1.4));
  animation: breathe 12s ease-in-out infinite alternate;
  z-index: 5;
}
.s-room .light-leak {
  background: radial-gradient(ellipse 24% 46% at 34% 36%, rgba(170, 205, 235, .30), transparent 72%);
}
.s-hall .light-leak {
  background: radial-gradient(ellipse 16% 34% at 50% 34%, rgba(255, 225, 180, .34), transparent 74%);
}
.s-empty .light-leak {
  background: radial-gradient(ellipse 26% 40% at 50% 46%, rgba(160, 200, 235, .24), transparent 74%);
}
@keyframes breathe {
  from { opacity: .34; transform: translate3d(-1%, 0, 0); }
  to   { opacity: .50; transform: translate3d(1%, -1%, 0); }
}

.overlay-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 92% 108% at 50% 50%, transparent 62%, rgba(0,0,0,.38) 100%),
    linear-gradient(180deg, rgba(0,0,0,.30) 0%, transparent 12%, transparent 88%, rgba(0,0,0,.36) 100%);
  z-index: 8;
}

.overlay-grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  opacity: .10;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  animation: grainShift 420ms steps(2) infinite;
}
@keyframes grainShift {
  0% { transform: translate3d(0, 0, 0); }
  50% { transform: translate3d(-1.5%, 1%, 0); }
  100% { transform: translate3d(1%, -1.5%, 0); }
}

/* ============================================================
   场景调色：一景一色
   ============================================================ */
.s-room  { filter: saturate(.82) contrast(1.08) brightness(1.02); }
.s-hall  { filter: saturate(.52) contrast(1.16); }
.s-hand  { filter: saturate(.74) contrast(1.14) brightness(1.06); }
.s-empty { filter: saturate(.50) contrast(1.14); }

/* ============================================================
   镜头 1：房间
   far = 窗外（装在窗洞里，负责视差与雨）
   mid = 墙 + 桌 + 台灯（负责结构）
   near = 前景暗框（负责纵深）
   ============================================================ */
.s-room .mid {
  background:
    linear-gradient(180deg, #2b2520 0%, #201b18 46%, #16120f 100%);
}

.s-room .win {
  position: absolute;
  left: 27%;
  top: 17%;
  width: 27%;
  height: 42%;
  overflow: hidden;
  background: #0c1015;
  border: calc(var(--u) * 1.0) solid #17120e;
  box-shadow:
    0 0 calc(var(--u) * 3.2) rgba(130, 172, 212, .16),
    0 0 calc(var(--u) * .8) rgba(0, 0, 0, .8),
    inset 0 0 calc(var(--u) * 3.5) rgba(0, 0, 0, .55);
}

.s-room .win .far {
  position: absolute;
  inset: -8%;
  background: linear-gradient(180deg, #1a2531 0%, #2c4a63 44%, #1b2833 100%);
}
.s-room .win .far::after {      /* 雨：双层斜纹，破掉规律感 */
  content: "";
  position: absolute;
  inset: -14%;
  background-image:
    repeating-linear-gradient(96deg, transparent 0 calc(var(--u) * 1.05), rgba(196, 220, 240, .30) calc(var(--u) * 1.05) calc(var(--u) * 1.13)),
    repeating-linear-gradient(92deg, transparent 0 calc(var(--u) * 1.75), rgba(196, 220, 240, .16) calc(var(--u) * 1.75) calc(var(--u) * 1.83));
  filter: blur(calc(var(--u) * .04));
  animation: rain 1.05s linear infinite;
}
@keyframes rain {
  from { transform: translate3d(0, -8%, 0); }
  to   { transform: translate3d(-4%, 9%, 0); }
}

.s-room .win::after {           /* 窗格 */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(50% - 1.2px), #100d0b calc(50% - 1.2px), #100d0b calc(50% + 1.2px), transparent calc(50% + 1.2px)),
    linear-gradient(180deg, transparent calc(44% - 1.2px), #100d0b calc(44% - 1.2px), #100d0b calc(44% + 1.2px), transparent calc(44% + 1.2px));
}

.s-room .desk {
  position: absolute;
  left: 10%;
  right: 34%;
  bottom: 0;
  height: 19%;
  background: linear-gradient(180deg, #43372a 0%, #241d16 68%, #14110e 100%);
  border-top: calc(var(--u) * .22) solid #5b4a35;
  box-shadow: 0 calc(var(--u) * -1) calc(var(--u) * 2.4) rgba(0, 0, 0, .8);
}

.s-room .lamp {
  position: absolute;
  left: 13%;
  bottom: 17%;
  width: calc(var(--u) * 6.4);
  height: calc(var(--u) * 5.6);
}
.s-room .lamp::before {          /* 灯罩剪影 + 光晕 */
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 64%;
  background: linear-gradient(180deg, #806649 0%, #3b2e22 100%);
  clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
  box-shadow:
    0 0 calc(var(--u) * 2) rgba(255, 205, 140, .45),
    0 0 calc(var(--u) * 9) rgba(255, 190, 120, .22);
}

.s-room .near {
  background:
    linear-gradient(90deg, rgba(6,6,8,.96) 0%, transparent 13%, transparent 87%, rgba(6,6,8,.96) 100%),
    linear-gradient(180deg, rgba(6,6,8,.92) 0%, transparent 15%, transparent 85%, rgba(6,6,8,.94) 100%);
  filter: blur(calc(var(--u) * .3));
}

/* ============================================================
   镜头 2 / 4：走廊
   ============================================================ */
.s-hall .far {
  background:
    radial-gradient(ellipse 30% 50% at 50% 48%, rgba(255, 226, 176, .26) 0%, transparent 76%),
    radial-gradient(ellipse 36% 14% at 50% 80%, rgba(255, 226, 176, .22) 0%, transparent 76%),
    linear-gradient(180deg, #14181e 0%, #1b2128 44%, #0b0d10 100%);
}

.s-hall .doorframe {             /* 门板：让那道光有出处 */
  position: absolute;
  left: 50%;
  top: 25%;
  width: 12.5%;
  height: 54%;
  transform: translateX(-50%);
  border: 1px solid rgba(216, 196, 162, .07);
  background: linear-gradient(180deg, rgba(28, 32, 39, .62), rgba(14, 16, 20, .82));
  box-shadow: 0 0 3.5vw rgba(0, 0, 0, .85);
  z-index: 1;
}

.s-hall .doorlight {             /* 门缝：走廊里唯一的光源 */
  position: absolute;
  left: 50%;
  top: 26%;
  width: 0.55%;
  height: 52%;
  transform: translateX(-50%);
  background: linear-gradient(
    180deg,
    rgba(255, 240, 205, .16) 0%,
    rgba(255, 240, 208, .88) 18%,
    rgba(255, 240, 208, .88) 78%,
    rgba(255, 240, 205, .14) 100%
  );
  box-shadow:
    0 0 2.2vw 0.30vw rgba(255, 226, 178, .40),
    0 0 7vw 2vw rgba(255, 218, 162, .16);
  z-index: 2;
}
.s-hall .far::after {            /* 地面光斑 */
  content: "";
  position: absolute;
  left: 50%;
  top: 74%;
  width: 22%;
  height: 9%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(255, 228, 180, .22) 0%, transparent 72%);
  filter: blur(calc(var(--u) * 1.4));
}

.s-hall .mid {                   /* 两侧墙 + 地面反光 */
  background:
    linear-gradient(180deg, transparent 60%, rgba(214, 192, 152, .12) 86%, transparent 100%),
    linear-gradient(90deg, #171a1f 0%, rgba(23,26,31,.55) 17%, transparent 33%, transparent 67%, rgba(23,26,31,.55) 83%, #171a1f 100%);
}
.s-hall .mid::before {           /* 地面线 */
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 61%;
  height: 1px;
  background: linear-gradient(90deg, transparent 4%, rgba(222, 202, 162, .26) 50%, transparent 96%);
}

.s-hall .near {                  /* 门框 */
  background:
    linear-gradient(90deg, rgba(5,5,7,.98) 0%, rgba(12,13,16,.9) 6%, transparent 9%, transparent 91%, rgba(12,13,16,.9) 94%, rgba(5,5,7,.98) 100%),
    linear-gradient(180deg, rgba(5,5,7,.95) 0%, transparent 10%, transparent 90%, rgba(5,5,7,.95) 100%);
  filter: blur(calc(var(--u) * .24));
}

/* 走廊里那个停下又走的影子 */
.s-hall .shadow {
  position: absolute;
  left: 50%;
  bottom: 26%;
  width: calc(var(--u) * 6);
  height: calc(var(--u) * 19);
  transform: translateX(-50%);
  background:
    radial-gradient(ellipse 46% 42% at 50% 16%, rgba(10,10,12,.96), transparent 72%),
    radial-gradient(ellipse 34% 60% at 50% 60%, rgba(10,10,12,.88), transparent 74%);
  filter: blur(calc(var(--u) * .42));
  opacity: 0;
  z-index: 4;
}
.s-hall .shadow.on { animation: shadowIn 7s ease-in-out forwards; }
@keyframes shadowIn {
  0%   { opacity: 0; transform: translateX(-50%) translateY(7%); }
  26%  { opacity: .96; transform: translateX(-50%) translateY(0); }
  64%  { opacity: .96; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-74%) translateY(2%); }
}

/* ============================================================
   镜头 3：门缝里的手（只有手，不给脸）
   黑场 + 一道门缝 + 缝里一个不成形的手影
   ============================================================ */
.s-hand { background: #050506; }

.s-hand .slit {
  position: absolute;
  left: 50%;
  top: 10%;
  width: 4.8%;
  height: 82%;
  transform: translateX(-50%);
  background: linear-gradient(
    180deg,
    rgba(255, 240, 206, 0) 0%,
    rgba(255, 240, 206, .52) 16%,
    rgba(255, 244, 216, .82) 50%,
    rgba(255, 240, 206, .52) 84%,
    rgba(255, 240, 206, 0) 100%
  );
  box-shadow:
    0 0 5vw 1vw rgba(255, 226, 178, .22),
    0 0 16vw 5vw rgba(255, 214, 160, .09);
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 11%, #000 89%, transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0%, #000 11%, #000 89%, transparent 100%);
}

.s-hand .hand-blob {
  position: absolute;
  left: 50%;
  top: 76%;
  width: 8.5%;
  height: 5.5%;
  transform: translate(-50%, -50%) rotate(-4deg);
  background: #000;
  filter: blur(calc(var(--u) * .9));
  mix-blend-mode: multiply;
  opacity: .96;
  animation: handMove 11s ease-in-out infinite alternate;
}
.s-hand .hand-blob.b2 {
  top: 70%;
  width: 1.7%;
  height: 5%;
  transform: translate(-50%, -50%) rotate(7deg);
  filter: blur(calc(var(--u) * .55));
  animation: handFade 7s ease-in-out infinite alternate;
}
.s-hand .hand-blob.b3 {
  top: 69%;
  width: 1.5%;
  height: 4.4%;
  transform: translate(-50%, -50%) rotate(-6deg) translateX(1.6%);
  filter: blur(calc(var(--u) * .55));
  opacity: .8;
  animation: handFade 9s ease-in-out infinite alternate-reverse;
}
@keyframes handMove {
  from { transform: translate(-50%, -50%) rotate(-13deg) translateY(0); }
  to   { transform: translate(-50%, -53%) rotate(-10deg) translateY(-1.5%); }
}
@keyframes handFade {
  from { opacity: .55; }
  to   { opacity: .95; }
}

/* ============================================================
   镜头 5：空镜（窗与雨）
   ============================================================ */
.s-empty {
  background: linear-gradient(180deg, #111820 0%, #1d2b38 46%, #0d1218 100%);
}
.s-empty .far {
  background: linear-gradient(180deg, #16202b 0%, #24384a 52%, #131b23 100%);
}
.s-empty .win {
  position: absolute;
  left: 31%;
  top: 21%;
  width: 38%;
  height: 54%;
  overflow: hidden;
  background: linear-gradient(180deg, #3d5d76 0%, #27414f 100%);
  border: calc(var(--u) * .55) solid #0a0a0b;
  box-shadow: 0 0 calc(var(--u) * 6) rgba(120, 165, 205, .16);
}
.s-empty .win::after {
  content: "";
  position: absolute;
  inset: -14%;
  background-image:
    repeating-linear-gradient(96deg, transparent 0 calc(var(--u) * 1.0), rgba(198, 222, 240, .34) calc(var(--u) * 1.0) calc(var(--u) * 1.08)),
    repeating-linear-gradient(92deg, transparent 0 calc(var(--u) * 1.6), rgba(198, 222, 240, .18) calc(var(--u) * 1.6) calc(var(--u) * 1.68));
  animation: rain 1.0s linear infinite;
}
.s-empty .cross {
  position: absolute;
  left: calc(31% + 19%);
  top: 21%;
  width: calc(var(--u) * .6);
  height: 54%;
  background: #08080a;
}
.s-empty .walker {
  position: absolute;
  bottom: 24%;
  left: -8%;
  width: calc(var(--u) * 3.6);
  height: calc(var(--u) * 11);
  background:
    radial-gradient(ellipse 46% 34% at 50% 16%, rgba(4,4,6,.96), transparent 70%),
    radial-gradient(ellipse 34% 56% at 50% 62%, rgba(4,4,6,.9), transparent 72%);
  filter: blur(calc(var(--u) * .46));
  opacity: 0;
}
.s-empty .walker.on { animation: walkBy 9s linear forwards; }
@keyframes walkBy {
  0%   { opacity: 0; transform: translateX(0); }
  12%  { opacity: .9; }
  88%  { opacity: .9; }
  100% { opacity: 0; transform: translateX(calc(var(--u) * 120)); }
}

/* ============================================================
   文字层
   ============================================================ */
.caption {
  position: absolute;
  left: 0;
  right: 0;
  top: 48%;
  transform: translateY(-50%);
  text-align: center;
  font-size: calc(var(--u) * 2.05);
  letter-spacing: .16em;
  color: var(--ink);
  opacity: 0;
  transition: opacity 900ms ease;
  z-index: 20;
  text-shadow: 0 0 calc(var(--u) * 2) rgba(0,0,0,.95);
  padding: 0 8%;
  line-height: 1.95;
}
.caption.on { opacity: 1; }

.caption.small {
  font-size: calc(var(--u) * 1.28);
  color: var(--ink-dim);
  letter-spacing: .32em;
}

.dialogue {
  position: absolute;
  left: 50%;
  bottom: 14%;
  transform: translateX(-50%);
  width: 76%;
  text-align: center;
  font-size: calc(var(--u) * 1.58);
  line-height: 1.95;
  letter-spacing: .05em;
  color: var(--ink);
  text-shadow: 0 0 calc(var(--u) * 1.8) rgba(0,0,0,1);
  z-index: 20;
  min-height: calc(var(--u) * 4);
}
.dialogue .line { display: block; opacity: 0; animation: lineIn 700ms ease forwards; }
@keyframes lineIn {
  from { opacity: 0; transform: translateY(calc(var(--u) * .4)); }
  to   { opacity: 1; transform: none; }
}
.dialogue .line .who {
  color: var(--warm);
  letter-spacing: .2em;
  margin-right: .6em;
  font-size: .86em;
}

.hud {
  position: absolute;
  left: calc(var(--u) * 3.2);
  top: calc(var(--u) * 2.6);
  font-size: calc(var(--u) * .95);
  letter-spacing: .34em;
  color: rgba(233, 227, 215, .48);
  z-index: 20;
  opacity: 0;
  transition: opacity 700ms ease;
}
.hud.on { opacity: 1; }

.life {
  position: absolute;
  right: calc(var(--u) * 3.2);
  bottom: calc(var(--u) * 2.4);
  font-size: calc(var(--u) * .80);
  letter-spacing: .12em;
  color: rgba(233, 227, 215, .32);
  text-align: right;
  line-height: 1.95;
  z-index: 20;
  opacity: 0;
  transition: opacity 900ms ease;
  max-width: 42%;
}
.life.on { opacity: 1; }

/* ---------- 灵感卡 ---------- */
.cards {
  position: absolute;
  left: 50%;
  bottom: 27%;
  transform: translateX(-50%);
  display: flex;
  gap: calc(var(--u) * .9);
  z-index: 22;
  opacity: 0;
  pointer-events: none;
  transition: opacity 500ms ease;
}
.cards.on { opacity: 1; pointer-events: auto; }
.cards button {
  font-family: inherit;
  font-size: calc(var(--u) * .95);
  letter-spacing: .1em;
  color: rgba(233, 227, 215, .80);
  background: rgba(16, 16, 18, .58);
  border: 1px solid rgba(233, 227, 215, .20);
  padding: calc(var(--u) * .55) calc(var(--u) * 1.15);
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: all 220ms ease;
  white-space: nowrap;
}
.cards button:hover {
  color: #fff;
  border-color: rgba(216, 180, 126, .62);
  background: rgba(44, 36, 26, .78);
}

/* ---------- 自由输入 ---------- */
.inputbar {
  position: absolute;
  left: 50%;
  bottom: 9%;
  transform: translateX(-50%);
  width: 56%;
  display: flex;
  align-items: center;
  gap: calc(var(--u) * .8);
  border-bottom: 1px solid rgba(233, 227, 215, .24);
  padding-bottom: calc(var(--u) * .5);
  z-index: 22;
  opacity: 0;
  pointer-events: none;
  transition: opacity 500ms ease;
}
.inputbar.on { opacity: 1; pointer-events: auto; }
.inputbar input {
  flex: 1;
  background: none;
  border: 0;
  outline: 0;
  color: var(--ink);
  font-family: inherit;
  font-size: calc(var(--u) * 1.30);
  letter-spacing: .06em;
  caret-color: var(--warm);
}
.inputbar input::placeholder { color: rgba(233, 227, 215, .30); }
.inputbar .key {
  font-size: calc(var(--u) * .76);
  letter-spacing: .2em;
  color: rgba(233, 227, 215, .32);
  white-space: nowrap;
}

/* ---------- 开场 ---------- */
.start {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: calc(var(--u) * 1.1);
  background: #050506;
  z-index: 40;
  transition: opacity 1200ms ease;
}
.start.off { opacity: 0; pointer-events: none; }

.start__title {
  font-size: calc(var(--u) * 3.4);
  letter-spacing: .5em;
  color: var(--ink);
  text-indent: .5em;
  opacity: 1;
  animation: titleIn 2.4s ease;
}
@keyframes titleIn {
  from { opacity: 0; filter: blur(9px); }
  to   { opacity: 1; filter: none; }
}

.start__sub {
  font-size: calc(var(--u) * 1.02);
  letter-spacing: .34em;
  color: rgba(233, 227, 215, .44);
}
.start__btn {
  margin-top: calc(var(--u) * 1.6);
  font-family: inherit;
  font-size: calc(var(--u) * 1.12);
  letter-spacing: .5em;
  text-indent: .5em;
  color: var(--ink);
  background: none;
  border: 1px solid rgba(233, 227, 215, .28);
  padding: calc(var(--u) * .8) calc(var(--u) * 3.4);
  cursor: pointer;
  transition: all 280ms ease;
}
.start__btn:hover { border-color: var(--warm); color: var(--warm); background: rgba(216, 180, 126, .06); }
.start__seed {
  margin-top: calc(var(--u) * 1.2);
  font-size: calc(var(--u) * .70);
  letter-spacing: .18em;
  color: rgba(233, 227, 215, .24);
}
.start__hint {
  position: absolute;
  bottom: calc(var(--u) * 3);
  font-size: calc(var(--u) * .74);
  letter-spacing: .18em;
  color: rgba(233, 227, 215, .28);
}

/* ---------- 结尾卡 ---------- */
.end-card {
  position: absolute;
  inset: 0;
  display: grid;

<style>
/* cine.css */
/* ============================================================
   cine.css · 电影层
   给所有场景统一加：画框暗边 / 镜头光晕 / 浮尘

/* 画框：四边压暗，模拟镜头边缘衰减 */

  position: absolute;

  pointer-events: none;
  z-index: 11;

    radial-gradient(ellipse 26% 34% at 12% 8%, rgba(150, 180, 210, 0.16), transparent 72%),

<script>
/* seed.js */
/* ============================================================
   seed.js · 世界的铸造机（UMD：Node 与浏览器共用同一份实现）
   输入种子 → 这一世的完整设定；同一个种子永远产生同一个世界
   ============================================================ */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.WorldSeed = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function fnv(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** 每个字段一条独立随机流 */
  function stream(seed, salt) {
    const r = mulberry32(fnv(seed + '#' + salt));
    const pick = (arr) => arr[Math.floor(r() * arr.length)];
    const draw = (arr, n) => {
      const c = arr.slice();
      const out = [];
      for (let i = 0; i < n && c.length; i++) {
        out.push(c.splice(Math.floor(r() * c.length), 1)[0]);
      }
      return out;
    };
    const int = (min, max) => min + Math.floor(r() * (max - min + 1));
    return { pick, draw, int };
  }

  /* ---------------- 素材池 ---------------- */
  const SURNAME = ['陈', '林', '周', '沈', '顾', '江', '许', '郑', '宋', '韩', '叶', '温', '白', '邵'];
  const GIVEN = ['默', '屿', '川', '帆', '舟', '野', '迟', '远', '白', '青', '望', '砚', '沉', '渡'];

  const ORIGIN = [
    { v: '外地来的', ef: '这条街上没有一个你认识的人' },
    { v: '本地长起来的', ef: '所有人都知道你小时候是什么样' },
    { v: '刚回来不久的', ef: '有人记得你走的时候说过不再回来' },
    { v: '被安排过来的', ef: '你来这里不是因为想' },
    { v: '躲过来的', ef: '有人还在原来的城市找你' }
  ];

  const FAMILY = [
    { v: '母亲一个人把你带大', hook: '她从不提父亲，你也不敢问' },
    { v: '父亲走了十年没消息', hook: '每年冬天都有一个没接的电话' },
    { v: '家里还有个上学的妹妹', hook: '她的学费是你欠下的第一笔债' },
    { v: '父母都在，但都不说话', hook: '你们家吃饭时只有电视的声音' },
    { v: '你从小在亲戚家轮着住', hook: '你没有一间房是自己的' },
    { v: '家里只剩你和你哥', hook: '他把房子留给了你，然后走了' },

      secret: sMother.pick(MOTHER_SECRET)
    };

      taboo: sCast.pick(TABOO),

    }));

        sOpen.pick(OPEN_PLACE) +
        '，' +
        sOpen.pick(OPEN_ODD) +
        '。'
    };
  }

  return { gen, fnv, mulberry32, stream };

<script>
/* voice.js */
/* ============================================================
   voice.js · 声线与音效
   人物声线：浏览器内置 TTS（speechSynthesis），按 pitch/rate 区分
   环境音效：Web Audio 现场合成，零素材
   ============================================================ */
(function (root) {
  'use strict';

  const V = {
    enabled: false,
    ready: false,
    zh: null,

    init() {
      if (!('speechSynthesis' in window)) return;
      const pick = () => {
        const vs = speechSynthesis.getVoices();
        this.zh =
          vs.find((v) => /zh[-_]CN|Chinese|中文|普通话/i.test(v.lang + v.name)) || null;
        this.ready = true;
      };
      pick();
      speechSynthesis.onvoiceschanged = pick;
    },

    /** profile: { pitch, rate, tag } —— 拆句 + 每句微调，去掉机器的平 */
    say(text, profile, onEnd) {
      const raw = String(text || '').trim();
      if (!this.enabled || !raw) {
        if (onEnd) setTimeout(onEnd, Math.min(2600, 60 * raw.length));
        return;
      }
      try {
        speechSynthesis.cancel();
        let parts = raw
          .split(/[，。！？；\n…]+/)
          .map((s) => s.trim())
          .filter((s) => s.length > 0)
          .slice(0, 6);
        if (!parts.length) parts = [raw];

        const basePitch = Math.max(0, Math.min(2, (profile && profile.pitch) || 1));
        const baseRate = Math.max(0.5, Math.min(2, (profile && profile.rate) || 1));

        parts.forEach((piece, i) => {
          const u = new SpeechSynthesisUtterance(piece);
          u.lang = 'zh-CN';
          if (this.zh) u.voice = this.zh;
          const j = ((i % 3) - 1) * 0.04;
          u.pitch = Math.max(0, Math.min(2, basePitch + j));
          u.rate = Math.max(0.5, Math.min(2, baseRate + j * 0.6));
          u.volume = 0.85;
          if (i === parts.length - 1 && onEnd) u.onend = onEnd;
          speechSynthesis.speak(u);
        });
      } catch (e) {
        if (onEnd) setTimeout(onEnd, 900);
      }
    },

    stop() {
      try {
        speechSynthesis.cancel();
      } catch (e) {}
    }
  };

  /* ---------------- 音效 ---------------- */
  const S = {
    ctx: null,
    master: null,
    buf: null,
    ok: false,

    start() {
      if (this.ok) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        const p = this.ctx.resume();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {
        return;
      }
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.buf = this.noise(5);
      this.ambient();
      this.ok = true;
    },

    noise(sec) {
      const ctx = this.ctx;
      const len = Math.floor(ctx.sampleRate * sec);
      const b = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = b.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.099046;
        b1 = 0.963 * b1 + w * 0.2965164;
        b2 = 0.57 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.09;
      }
      return b;
    },

    ambient() {
      const ctx = this.ctx;
      const src = ctx.createBufferSource();
      src.buffer = this.buf;
      src.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 620;
      const g = ctx.createGain();
      g.gain.value = 0.06;
      src.connect(lp);
      lp.connect(g);
      g.connect(this.master);
      src.start();
      this.ambGain = g;
    },

    /** 一次性音效 */
    hit(kind) {
      if (!this.ok) return;
      const ctx = this.ctx;
      const t = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = this.buf;
      const bp = ctx.createBiquadFilter();
      const g = ctx.createGain();
      let freq = 500, q = 1.2, dur = 0.2, vol = 0.3;

      if (kind === 'step') { freq = 460; dur = 0.18; vol = 0.3; }
      else if (kind === 'door') { freq = 180; q = 0.7; dur = 0.5; vol = 0.32; }
      else if (kind === 'paper') { freq = 2600; q = 2.4; dur = 0.14; vol = 0.2; }
      else if (kind === 'glass') { freq = 3200; q = 3.2; dur = 0.3; vol = 0.22; }
      else if (kind === 'heart') { freq = 90; q = 0.9; dur = 0.55; vol = 0.4; }
      else if (kind === 'breath') { freq = 700; q = 0.8; dur = 0.7; vol = 0.16; }
      else if (kind === 'pick') { freq = 1400; q = 1.8; dur = 0.16; vol = 0.24; }
      else if (kind === 'bell') { freq = 1200; q = 8; dur = 1.6; vol = 0.2; }

      bp.type = 'bandpass';
      bp.frequency.value = freq;
      bp.Q.value = q;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp);
      bp.connect(g);
      g.connect(this.master);
      src.start(t);
      src.stop(t + dur + 0.05);
    },

    async silence(ms) {
      if (!this.ok) return new Promise((r) => setTimeout(r, ms));
      const t = this.ctx.currentTime;
      const g = this.master.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(0.0001, t + 0.25);
      g.setValueAtTime(0.0001, t + ms / 1000);
      g.linearRampToValueAtTime(0.9, t + ms / 1000 + 0.7);
      return new Promise((r) => setTimeout(r, ms));
    },

    setMood(mood) {
      if (!this.ok || !this.ambGain) return;
      const target = mood === 'night' ? 0.035 : mood === 'dawn' ? 0.05 : 0.075;
      const t = this.ctx.currentTime;
      this.ambGain.gain.cancelScheduledValues(t);
      this.ambGain.gain.linearRampToValueAtTime(target, t + 1.4);
    }
  };

  V.init();
  root.VOICE = V;
  root.SFX = S;
})(typeof self !== 'undefined' ? self : this);

<script>
/* music.js */
/* ============================================================
   music.js · 背景音乐（现场合成）
   一段极慢的五声音阶，一个持续低音，没有噪声。
   ============================================================ */
(function (root) {
  'use strict';

  const SCALE = [220.0, 261.63, 293.66, 349.23, 392.0, 440.0]; // A C D F G A
  const BASS = 55.0;

  const M = {
    ctx: null,
    master: null,
    bassOsc: null,
    timer: null,
    step: 0,
    on: false,

    start() {
      if (this.on) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        if (!this.ctx) this.ctx = new AC();
        const p = this.ctx.resume();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {
        return;
      }
      const ctx = this.ctx;

      const master = ctx.createGain();
      master.gain.value = 0.0001;
      master.connect(ctx.destination);
      this.master = master;

      // 一条很轻的低音，从头到尾不换
      const bass = ctx.createOscillator();
      bass.type = 'sine';
      bass.frequency.value = BASS;
      const bg = ctx.createGain();
      bg.gain.value = 0.05;
      const blp = ctx.createBiquadFilter();
      blp.type = 'lowpass';
      blp.frequency.value = 220;
      bass.connect(bg);
      bg.connect(blp);
      blp.connect(master);
      bass.start();
      this.bassOsc = bass;

      master.gain.linearRampToValueAtTime(0.09, ctx.currentTime + 5);

      // 极慢的旋律：每隔两秒多一个音
      const tick = () => {
        if (!this.on) return;
        this.pluck();
        const gap = 2200 + Math.random() * 2600;
        this.timer = setTimeout(tick, gap);
      };
      this.on = true;
      this.timer = setTimeout(tick, 1200);
    },

    pluck() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const t = ctx.currentTime;

      // 旋律偶尔跳一下，偶尔重复上一个音
      if (Math.random() < 0.28) {
        // 停一拍
      } else {
        this.step = Math.max(
          0,
          Math.min(SCALE.length - 1, this.step + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.3 ? 2 : 1))
        );
      }

      const freq = SCALE[this.step];
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;

      const harm = ctx.createOscillator();
      harm.type = 'triangle';
      harm.frequency.value = freq * 2;

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.055, t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);

      const hg = ctx.createGain();
      hg.gain.value = 0.28;
      harm.connect(hg);

      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1800;

      osc.connect(g);
      hg.connect(g);
      g.connect(lp);
      lp.connect(this.master);

      osc.start(t);
      harm.start(t);
      osc.stop(t + 3.6);
      harm.stop(t + 3.6);
    },

    duck(sec) {
      if (!this.on || !this.ctx) return;
      const t = this.ctx.currentTime;
      const g = this.master.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(0.02, t + 0.6);
      g.setValueAtTime(0.02, t + (sec || 3));
      g.linearRampToValueAtTime(0.09, t + (sec || 3) + 1.6);
    },

    stop() {
      this.on = false;
      if (this.timer) clearTimeout(this.timer);
      try {
        if (this.bassOsc) this.bassOsc.stop();
      } catch (e) {}
      this.bassOsc = null;
    }
  };

  root.MUSIC = M;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* film.js */
/* ============================================================
   film.js · 《妄》· 回到手工场景版
   ------------------------------------------------------------
   场景全部来自 world.js 的手工布局（大窗 / 雨 / 门 / 台灯 / 桌），
   不再用程序化道具拼贴。
   规矩：
     1. 点下去的每一处，世界都要变。
     2. 关键物件带线索，线索拼成真相。
     3. 时钟只会向前，天黑就得回家。
   ============================================================ */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const hm = window.hm;
  const SCENES = window.WORLD_SCENES;
  if (window.SCENES2) Object.assign(SCENES, window.SCENES2);
  const STORY = window.NPC_STORY || {};

  /* 照片层：art/<场景>.jpg 存在就用，不存在就退回纯 CSS */
  const PHOTO_OK = {};

  function probePhotos() {
    const names = ['room', 'hall', 'street', 'shop', 'home', 'clinic', 'police',
      'funeral', 'oldhouse', 'oldinside', 'river', 'market'];
    for (const n of names) {
      const img = new Image();
      img.onload = () => {
        if (img.naturalWidth > 200) {
          PHOTO_OK[n] = true;
          const el = host.querySelector('.scene');
          if (el && S.scene === n && el.className.indexOf('photo-' + n) < 0) {
            el.className += ' photo-' + n;
          }
        }
      };
      img.src = 'art/' + n + '.jpg';
    }
  }

  /* 物件 → 音效 */
  function sfxFor(hs) {
    const k = String((hs && hs.id) || '');
    if (/window|glass|mirror/.test(k)) return 'glass';
    if (/note|chart|form|paper|list|board|photo|seal/.test(k)) return 'paper';
    if (/door|gate|out|back|leave|down|up|stairs|drawer|open/.test(k)) return 'door';
    if (/phone|bell|radio|clock/.test(k)) return 'bell';
    if (/bed|bench|chair|floor|walls/.test(k)) return 'step';
    if (/water|puddle|river|rain/.test(k)) return 'breath';
    return 'pick';
  }

  const QS = new URLSearchParams(location.search);
  const SEED =
    QS.get('seed') || (Date.now().toString(36) + Math.random().toString(36).slice(2, 5)).toUpperCase();

  const LIFE = window.WorldSeed.gen(SEED);
  const CITY = window.CITY;

  /* 哪件东西藏着哪枚线索 */
  const CLUE_OF = { note: 4, phone: 3, bag: 9, third: 2, board: 1, pills: 5, locked: 11 };

  const S = {
    life: LIFE,
    hour: 5 * 60 + 40,
    money: LIFE.who.base_money + 120,
    stamina: 100,
    food: 0,
    rel: { mother: LIFE.mother.trust, aunt: 0, boss: 0 },
    flags: {},
    seen: {},
    scene: 'room',
    turns: 0,
    clues: [],
    bag: [],
    talked: {},
    finished: false
  };

  /* ---------------- 跨世 ---------------- */
  const TKEY = 'wang.trace.v1';
  const TRACE = (() => {
    try {
      return JSON.parse(localStorage.getItem(TKEY) || 'null');
    } catch (e) {
      return null;
    }
  })();

  /* ---------------- DOM ---------------- */
  const frame = $('#frame');
  const host = $('#scenes');
  const hsLayer = $('#hotspots');
  const flash = $('#flash');
  const panel = $('#panel');
  const panelText = $('#panelText');
  const topDay = $('#topDay');
  const topPlace = $('#topPlace');
  const topClue = $('#topClue');
  const exitsEl = $('#exits');
  const freeInput = $('#free');
  const freeBar = $('#inputbar');
  const endCard = $('#end');
  const clueBtn = $('#topClue');
  const cluePanel = $('#cluePanel');
  const clueList = $('#clueList');

  /* ---------------- 证据册 ---------------- */
  function renderClues() {
    if (!clueList) return;
    const rows = [];
    for (const id of S.clues) {
      const sec = CITY && CITY.SECRETS ? CITY.SECRETS.find((x) => x.id === id) : null;
      if (sec) {
        rows.push(
          '<div class="row">' + sec.text + '<small>—— ' + sec.owner + '</small></div>'
        );
      }
    }
    for (const it of S.bag) {
      rows.push('<div class="row item">' + it + '<small>—— 你身上的东西</small></div>');
    }
    clueList.innerHTML = rows.length
      ? rows.join('')
      : '<div class="empty">你还什么都没查清楚。</div>';
    if (clueBtn) clueBtn.textContent = '线索 ' + S.clues.length + '/12　物品 ' + S.bag.length;
  }

  /* ---------------- 文本 ---------------- */
  let typing = false;
  let skip = false;

  function instant(text) {
    panel.classList.add('on');
    const p = document.createElement('p');
    p.className = 'ln';
    p.textContent = text;
    panelText.appendChild(p);
    while (panelText.children.length > 5) panelText.removeChild(panelText.firstChild);
    panelText.scrollTop = panelText.scrollHeight;
  }

  async function narrate(text) {
    panel.classList.add('on');
    const p = document.createElement('p');
    p.className = 'ln';
    panelText.appendChild(p);
    while (panelText.children.length > 5) panelText.removeChild(panelText.firstChild);
    typing = true;
    skip = false;
    const lines = String(text).split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (i) p.appendChild(document.createElement('br'));
      const L = lines[i];
      for (let k = 0; k < L.length; k++) {
        p.appendChild(document.createTextNode(L[k]));
        panelText.scrollTop = panelText.scrollHeight;
        if (skip) {
          p.appendChild(document.createTextNode(L.slice(k + 1)));
          break;
        }
        await sleep(L[k] === '。' || L[k] === '，' ? 100 : 24);
      }
    }
    typing = false;
  }

  /* ---------------- HUD ---------------- */
  const PHASE = (h) =>
    h < 7 * 60
      ? '凌晨'
      : h < 9 * 60
      ? '清晨'
      : h < 12 * 60
      ? '上午'
      : h < 14 * 60
      ? '中午'
      : h < 17 * 60
      ? '下午'
      : h < 19 * 60
      ? '黄昏'
      : '夜里';

  function renderHud() {
    topDay.textContent = '第 1 天 · ' + PHASE(S.hour) + ' · ' + hm(S.hour);
    topPlace.textContent = SCENES[S.scene].title;
    topClue.textContent =
      '线索 ' + S.clues.length + '/12　体力 ' + Math.max(0, Math.round(S.stamina));
  }

  /* ---------------- 场景之间的路 ---------------- */
  const LINKS = {
    room: ['hall'],
    hall: ['room', 'street'],
    street: ['hall', 'shop', 'market', 'police', 'clinic', 'funeral', 'oldhouse', 'river'],
    shop: ['street'],
    home: ['street'],
    clinic: ['street'],
    police: ['street'],
    funeral: ['street'],
    oldhouse: ['street', 'oldinside'],
    oldinside: ['oldhouse'],
    river: ['street'],
    market: ['street']
  };

  /* 能坐下休息的地方 */
  const REST_IDS = ['bed', 'bed2', 'bench', 'bench2', 'bench3', 'chair', 'seat', 'table', 'bed '];

  /* 能拿起来带走的东西 */
  const TAKE = {
    note: '一张字条',
    photo: '一张发黄的旧照片',
    drawer: '一把缠着布的小刀',
    box: '一个写着 402 的纸箱',
    chart: '一页被撕掉一半的病历',
    list: '一张殡仪馆的名单',
    seal: '一段干透的封条',
    slip: '一张银行凭条',
    ticket: '一张过期车票',
    prescription: '一张处方'
  };

  /* 谁在说话 */
  const VOICE_OF = {
    mother: 'mother', aunt: 'aunt', landlord: 'landlord', boss: 'boss',
    nurse: 'nurse', officer: 'officer', attendant2: 'attendant2',
    vendor: 'vendor', priest: 'priest', seller: 'seller',
    attendant: 'attendant', guard: 'guard', owner: 'owner',
    clerk: 'clerk', teller: 'teller', janitor: 'janitor', stranger: 'stranger'
  };

  /* ---------------- 三天，三个视角 ---------------- */
  const DAYS = [
    { who: '你', start: 'room', open: '第 1 天。\n你在出租屋醒来。' },
    {
      who: '母亲',
      start: 'home',
      open: '第 2 天。\n这一次，你是母亲。\n天还没亮，你在厨房里择菜。'
    },
    {
      who: '值班民警',
      start: 'police',
      open: '第 3 天。\n这一次，你是值班民警。\n接警记录上多了一条，时间和十几年前那条一样。'
    }
  ];

  /* 真实时间：3 秒 = 游戏 1 分钟（一天约 50 分钟真实） */
  let clock = null;
  function startClock() {
    if (clock) return;
    clock = setInterval(() => {
      if (S.finished) return;
      S.hour += 1;
      renderHud();
      if (S.hour >= 23 * 60 + 30) {
        stopClock();
        finish();
      }
    }, 3000);
  }
  function stopClock() {
    if (clock) {
      clearInterval(clock);
      clock = null;
    }
  }

  async function nextDay() {
    endCard.classList.remove('on');
    S.day += 1;
    if (S.day > DAYS.length) return;
    S.hour = 5 * 60 + 40;
    S.stamina = 100;
    S.finished = false;
    S.flags = {};
    S.seen = {};
    const d = DAYS[S.day - 1];
    S.scene = d.start;
    renderScene();
    startClock();
    await sleep(600);
    await narrate(d.open);
    if ($('#topDay')) $('#topDay').textContent = '第 ' + S.day + ' 天 · ' + PHASE(S.hour) + ' · ' + hm(S.hour);
  }

  /* ---------------- 场景 ---------------- */
  function hotspotList() {
    const sc = SCENES[S.scene];
    const list = sc.hotspots.slice();
    if (S.scene === 'street' && S.hour >= 17 * 60) {
      list.push({
        id: 'gohome',
        label: '回家',
        rect: [60, 46, 18, 18],
        run: () => ({ text: '你往家属院走。路灯一盏一盏在你身后灭。', cost: 25, go: 'home' })
      });
    }
    return list;
  }

  function paintHotspots() {
    if (!hsLayer) return;
    hsLayer.innerHTML = '';
    hsLayer.classList.toggle('tired', S.stamina <= 0);
    for (const hs of hotspotList()) {
      const b = document.createElement('button');
      b.className = 'hs';
      b.type = 'button';
      b.style.left = hs.rect[0] + '%';
      b.style.top = hs.rect[1] + '%';
      b.style.width = hs.rect[2] + '%';
      b.style.height = hs.rect[3] + '%';
      const sp = document.createElement('span');
      sp.textContent = hs.label;
      b.appendChild(sp);
      b.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        act(hs);
      });
      hsLayer.appendChild(b);
    }
  }

  function renderScene() {
    const sc = SCENES[S.scene];
    const photo = PHOTO_OK[S.scene] ? ' photo-' + S.scene : '';
    host.innerHTML =
      '<div class="scene live ' + sc.cls + photo + '">' + sc.layer() +
      '<div class="dust-layer"></div></div>';
    host.classList.add('on');
    paintHotspots();
    renderExits();
    renderHud();
  }

  /* 右上角：能去哪儿 */
  function renderExits() {
    if (!exitsEl) return;
    exitsEl.innerHTML = '';
    const list = LINKS[S.scene] || [];
    for (const id of list) {
      if (!SCENES[id]) continue;
      const b = document.createElement('button');
      b.className = 'exit';
      b.type = 'button';
      b.textContent = SCENES[id].title.replace(/^.*?·\s*/, '');
      b.addEventListener('click', (e) => {
        e.preventDefault();
        goScene(id);
      });
      exitsEl.appendChild(b);
    }
    if (S.scene === 'street' && S.hour >= 17 * 60) {
      const b = document.createElement('button');
      b.className = 'exit';
      b.type = 'button';
      b.textContent = '家';
      b.addEventListener('click', (e) => {
        e.preventDefault();
        goScene('home');
      });
      exitsEl.appendChild(b);
    }
  }

  async function goScene(id) {
    if (busy || S.finished) return;
    if (S.stamina <= 0) {
      await narrate('你连走路的力气都没有了。\n先找个地方坐下来。');
      return;
    }
    busy = true;
    S.stamina = Math.max(0, S.stamina - 2);
    S.hour += 8;
    window.SFX.hit('step');
    flash.classList.add('on');
    await sleep(420);
    S.scene = id;
    renderScene();
    flash.classList.remove('on');
    await sleep(360);
    await narrate('你到了' + SCENES[id].title + '。');
    renderHud();
    busy = false;
  }

  /* ---------------- 行动 ---------------- */
  let busy = false;

  async function act(hs) {
    if (busy || S.finished) return;

    const rest = REST_IDS.indexOf(hs.id) >= 0;
    if (S.stamina <= 0 && !rest) {
      await narrate('你抬不起手。\n得先找个地方坐下——床、椅子、长椅都行。');
      return;
    }

    busy = true;
    if (hsLayer) hsLayer.classList.add('dim');
    S.turns++;

    let res = null;
    try {
      res = hs.run(S);
    } catch (e) {
      res = { text: '……', cost: 4 };
    }
    if (!res) {
      busy = false;
      host.classList.remove('dim');
      return;
    }

    if (res.go === '__end__') {
      busy = false;
      return finish();
    }

    // 体力与音效：每一次触碰都有代价，也都有声音
    window.SFX.hit(sfxFor(hs));
    if (rest) {
      S.stamina = Math.min(100, S.stamina + 55);
      S.hour += 40;
    } else {
      S.stamina = Math.max(0, S.stamina - 2);
    }

    if (res.text) await narrate(res.text);

    if (rest) await narrate('你坐下来，缓了很久。\n力气回来一些。');

    // 人物声线：谁说这句话，就用谁的嗓子
    const nid = res.voice || VOICE_OF[hs.id];
    if (nid && CITY && CITY.NPCS) {
      const n = CITY.NPCS.find((x) => x.id === nid);
      if (n) {
        const mm = String(res.text).match(/「([^」]{1,40})」/);
        const spoken = mm ? mm[1] : String(res.text).split('\n')[0];
        window.VOICE.say(spoken, n.voice);
      }
    }

    // 人物的过去 / 现在 / 未来
    if (STORY[hs.id]) {
      const c = (S.talked[hs.id] || 0) + 1;
      S.talked[hs.id] = c;
      const st = STORY[hs.id];
      const layer = c === 1 ? st.past : c === 2 ? st.now : st.future;
      await sleep(200);
      await narrate('（' + (hs.label || '他') + '）\n' + layer);
    }

    // 体力见底：不替你跳时间，只是不能再动
    if (S.stamina <= 0) {
      if (window.MUSIC) window.MUSIC.duck(3);
      await narrate('你眼前发黑。\n再动一下就站不住了——找个地方坐下。');
      if (hsLayer) hsLayer.classList.add('tired');
    }

    if (res.effects) {
      try {
        res.effects(S);
      } catch (e) {}
    }

    // 线索
    const cid = CLUE_OF[hs.id];
    if (cid && S.clues.indexOf(cid) < 0) {
      S.clues.push(cid);
      const sec = CITY.SECRETS.find((x) => x.id === cid);
      window.SFX.hit('heart');
      await sleep(260);
      await narrate('【线索 ' + S.clues.length + '/12】' + sec.text + '\n—— ' + sec.owner);
      if (window.MUSIC) window.MUSIC.duck(2);
    }

    // 能拿走的东西
    if (TAKE[hs.id] && S.bag.indexOf(TAKE[hs.id]) < 0) {
      S.bag.push(TAKE[hs.id]);
      await narrate('你把它收进了口袋。\n（' + TAKE[hs.id] + '）');
    }
    renderClues();

    if (res.cost) S.hour += Math.max(1, Math.round(res.cost * 0.3));

    if (res.go) {
      flash.classList.add('on');
      await sleep(460);
      S.scene = res.go;
      renderScene();
      flash.classList.remove('on');
      await sleep(400);
      await narrate('你走进' + SCENES[res.go].title + '。');
    } else {
      renderHotspotsRefresh();
    }

    renderHud();

    if (!S.finished && S.hour >= 22 * 60 && !S.flags.warned) {
      S.flags.warned = true;
      await narrate('快十一点了。这一天快过完了。');
    }
    if (!S.finished && S.hour >= 23 * 60 + 30) {
      busy = false;
      return finish();
    }

    host.classList.remove('dim');
    busy = false;
  }

  function renderHotspotsRefresh() {
    paintHotspots();
  }

  /* ---------------- 自由输入 ---------------- */
  async function freeAct(raw) {
    if (busy || S.finished) return;
    const t = String(raw || '').trim();
    if (!t) return;
    freeInput.value = '';
    busy = true;
    host.classList.add('dim');
    S.turns++;
    instant('> ' + t);

    const sc = SCENES[S.scene];
    const has = (...ws) => ws.some((w) => t.indexOf(w) >= 0);

    // 原地休息：不用找床，站着也能歇
    if (has('休息', '歇', '坐一会', '坐一下', '喘口气', '缓缓')) {
      await narrate('你靠着墙，慢慢滑下去。\n雨声在很远的地方。');
      await sleep(3600);
      S.stamina = Math.min(100, S.stamina + 35);
      S.hour += 10;
      if (window.SFX) window.SFX.hit('breath');
      await narrate('……力气回来一些。');
      renderHud();
      renderClues();
      busy = false;
      if (hsLayer) hsLayer.classList.remove('dim');
      return;
    }

    if (S.scene === 'home') {
      await talkMother(t, has);
      busy = false;
      host.classList.remove('dim');
      renderHud();
      return;
    }

    let target = null;
    if (has('窗', '外面', '雨')) target = 'window';
    else if (has('字条', '纸', '桌')) target = 'note';
    else if (has('手机', '电话')) target = 'phone';
    else if (has('灯')) target = 'lamp';
    else if (has('包', '钱')) target = 'bag';
    else if (has('睡', '躺', '床')) target = 'bed';
    else if (has('门', '出去', '走', '离开')) target = sc.hotspots.find((h) => h.id === 'door') ? 'door' : 'down';
    else if (has('妈', '母亲', '她')) target = 'aunt';
    else if (has('上班', '打工', '工作')) target = 'work';
    else if (has('买', '吃')) target = 'buy';
    else if (has('公告', '招工')) target = 'board';
    else if (has('等', '车')) target = 'busstop';

    const hit = sc.hotspots.find((h) => h.id === target);
    if (hit) {
      busy = false;
      return act(hit);
    }

    const fb = [
      '你站在原地，把这句话在心里过了一遍。没有人接。',
      '你说了。雨声盖住了后半句。',
      '你张了张嘴。最后什么也没做。',
      '这句话在这个地方没有回音。'
    ];
    await narrate(fb[S.turns % fb.length]);
    window.SFX.hit('breath');
    S.hour += 6;
    renderHud();
    host.classList.remove('dim');
    busy = false;
  }

  async function talkMother(t, has) {
    S.talked.mother = (S.talked.mother || 0) + 1;
    S.flags.talkedMother = true;

    if (has('医院', '病', '检查')) {
      S.flags.askedHospital = true;
      S.rel.mother -= 4;
      await window.SFX.silence(1200);
      await narrate('你问她医院的事。\n她手上的动作停了一下，又继续。\n「没什么事。你别听别人乱讲。」\n—— 她没说「谁」。');
      window.VOICE.say('没什么事。你别听别人乱讲。', CITY.NPCS[0].voice);
    } else if (has('药', '停')) {
      S.flags.askedPills = true;
      S.rel.mother -= 2;
      await narrate('你问她药还有没有。\n「有。够吃。」\n她说这句话的时候，看的是柜子那边。');
      window.VOICE.say('有。够吃。', CITY.NPCS[0].voice);
    } else if (has('对不起', '抱歉')) {
      S.rel.mother += 8;
      S.flags.apologized = true;
      await window.SFX.silence(900);
      await narrate('你说对不起。\n她把菜放下，看了你很久。\n「说什么呢。」\n—— 你注意到她的手在抖。');
      window.VOICE.say('说什么呢。', CITY.NPCS[0].voice);
    } else if (has('走', '离开', '外地')) {
      S.flags.mentionedLeaving = true;
      S.rel.mother -= 3;
      await narrate('你说你想走。\n她没有抬头。\n「哦。」\n就一个字。');
      window.VOICE.say('哦。', CITY.NPCS[0].voice);
    } else if (has('爸', '父亲')) {
      S.flags.askedFather = true;
      await narrate('你提起父亲。\n她把灯调暗了一点。\n「吃饭吧。」');
      window.VOICE.say('吃饭吧。', CITY.NPCS[0].voice);
    } else {
      await narrate('她听完，点点头。\n「' + LIFE.mother.obsession + '。」\n她说得很轻，像是说给自己听。');
      window.VOICE.say(LIFE.mother.obsession, CITY.NPCS[0].voice);
      S.rel.mother += 1;
    }
    S.hour += 12;
    renderHud();
  }

  /* ---------------- 结局 ---------------- */
  function verdict() {
    const f = S.flags;
    const n = S.clues.length;
    if (f.askedHospital) return '你问了。她说了「没什么事」。你信了。';
    if (f.knowStopMeds && !f.askedPills) return '你看见了那些药。你什么都没问。';
    if (f.apologized) return '你说了对不起。这句话她等了很久，但你没说为什么。';
    if (f.mentionedLeaving) return '你说你想走。她只回了一个字。';
    if (n >= 6) return '你手里有一些东西。它们还不能叫真相，只能叫怀疑。';
    if (f.worked) return '你上了一天班。这一天你没有见到她。';
    if (S.turns <= 4) return '这一天你几乎什么都没做。它也就这么过去了。';
    return '这一天过完了。你没有做错什么，也没有做成什么。';
  }

  async function finish() {
    if (S.finished) return;
    S.finished = true;
    stopClock();
    exitsEl.innerHTML = '';
    freeBar.classList.remove('on');
    panel.classList.remove('on');
    window.VOICE.stop();
    await window.SFX.silence(1500);

    const summary = [];
    if (S.flags.metAunt) summary.push('邻居说了，你妈在楼梯口坐过半个钟头。');
    if (S.flags.knowStopMeds) summary.push('柜子上的药，剩的量不对。');
    if (S.flags.worked) summary.push('你挣了八十五块。');
    if (S.flags.talkedMother) summary.push('你和母亲说了话。');
    else summary.push('你没和母亲说话。');

    $('#endTitle').textContent = '第 ' + S.day + ' 天结束';
    $('#endSub').textContent = '线索 ' + S.clues.length + '/12 · 物品 ' + S.bag.length + '\n' + summary.join('\n');
    $('#epitaph').textContent = verdict();
    $('#trace').textContent = TRACE ? '三号院还记得：' + TRACE.identity : '这一次，你叫' + LIFE.who.name;

    const again = $('#again');
    if (again) {
      if (S.day < DAYS.length) {
        again.textContent = '继续 · 第 ' + (S.day + 1) + ' 天（' + DAYS[S.day].who + '的视角）';
        again.onclick = (e) => {
          e.preventDefault();
          nextDay();
        };
      } else {
        again.textContent = '从头再来';
        again.onclick = () => location.reload();
      }
    }

    try {
      localStorage.setItem(TKEY, JSON.stringify({ identity: LIFE.who.name, clues: S.clues.length, seed: SEED, at: Date.now() }));
    } catch (e) {}

    await sleep(600);
    endCard.classList.add('on');
  }

    },

  /* ---------------- 开场动画：两场命案 ---------------- */
  let introSkip = false;
  let introPlayed = false;

  async function playIntro() {
    if (introPlayed) return;
    introPlayed = true;
    const el = $('#intro');
    const stage = $('#introStage');
    const txt = $('#introText');
    if (!el) return;

    // 开场就有音乐，别让这段干着
    if (window.SFX) window.SFX.start();
    if (window.MUSIC) window.MUSIC.start();

    el.style.display = '';
    el.classList.add('on');
    await sleep(700);

    const steps = [
      { scene: null, dim: true, lines: ['十几年前。', '西街 17 号。'], dur: 3400 },
      { scene: 'oldhouse', lines: ['一个男人死在自己家里。', '四十七刀。'], dur: 4600 },
      { scene: 'oldhouse', lines: ['案子没破。', '那间屋一直锁着。'], dur: 4200 },
      { scene: 'room', lines: ['今天凌晨，三点四十。', '同样的手法。'], dur: 4400 },
      { scene: 'room', lines: ['死者手里攥着一张纸条。', '上面写着：临江路 3 号 402。'], dur: 5000 },
      { scene: null, lines: ['你住在那儿。'], dur: 3400 },
      { scene: null, big: true, lines: ['妄'], dur: 3600 },
      { scene: null, dim: true, lines: ['每个人都有妄念。', '每个人都有过错。'], dur: 3800 }
    ];

    for (const s of steps) {
      if (introSkip) break;
      if (s.scene && SCENES[s.scene]) {
        stage.innerHTML =
          '<div class="scene live ' + SCENES[s.scene].cls + '">' + SCENES[s.scene].layer() +
          '<div class="dust-layer"></div></div>';
        stage.classList.add('on');
      } else {
        stage.classList.remove('on');
      }
      txt.className = 'intro__text' + (s.big ? ' big' : '') + (s.dim ? ' dim' : '');
      // 一次只放一句，绝不叠
      const per = Math.max(1400, Math.round(s.dur / Math.max(1, s.lines.length)));
      for (const line of s.lines) {
        if (introSkip) break;
        txt.innerHTML = '<span class="l">' + line + '</span>';
        await sleep(per);
      }
      if (introSkip) break;
      txt.innerHTML = '';
      stage.classList.remove('on');
      await sleep(320);
    }

    introSkip = true;
    el.classList.remove('on');
    await sleep(900);
    el.style.display = 'none';
    stage.innerHTML = '';
    const st = $('#start');
    if (st) {
      st.classList.remove('off');
      st.style.display = '';
    }
  }

  /* ---------------- 端到端自测：真的去点 ---------------- */
  async function runE2E() {
    const log = [];
    const t0 = Date.now();
    const rec = (s) => log.push(String(Date.now() - t0).padStart(6) + 'ms  ' + s);

    const snap = () =>
      '场景=' + S.scene +
      ' 线索=' + S.clues.length +
      ' 背包=' + S.bag.length +
      ' 体力=' + Math.round(S.stamina) +
      ' 时刻=' + hm(S.hour);

    const clickLabel = async (label, wait) => {
      const hs = Array.from(document.querySelectorAll('#hotspots .hs'));
      const el = hs.find((h) => h.textContent.trim() === label);
      if (!el) {
        rec('✗ 找不到热区「' + label + '」（当前 ' + hs.length + ' 个：' +
          hs.map((h) => h.textContent).join('/') + '）');
        return false;
      }
      const before = snap();
      el.click();
      await sleep(wait || 2600);
      const after = snap();
      rec((before === after ? '· 点了「' + label + '」没变化' : '✓ 点了「' + label + '」') + ' → ' + after);
      return true;
    };

    const clickExit = async (label) => {
      const list = Array.from(document.querySelectorAll('#exits .exit'));
      const el = list.find((b) => b.textContent.indexOf(label) >= 0);
      if (!el) {
        rec('✗ 没有出口「' + label + '」（现有：' + list.map((b) => b.textContent).join('/') + '）');
        return false;
      }
      el.click();
      await sleep(2400);
      rec('✓ 走「' + label + '」 → ' + snap());
      return true;
    };

    try {
      if ($('#begin')) {
        $('#begin').click();
        await sleep(3200);
        // 固定从出租屋开始，测试用例才有意义
        S.scene = 'room';
        renderScene();
        await sleep(1000);
        rec('开始 → ' + snap() + '（热区：' +
          Array.from(document.querySelectorAll('#hotspots .hs')).map((h) => h.textContent).join('/') + '）');
      }

      await clickLabel('窗');
      await clickLabel('桌上的字条');
      await clickLabel('背包');
      await clickLabel('手机');
      await clickLabel('门');
      await clickLabel('隔壁的门', 3400);
      await clickLabel('下楼');
      await clickExit('二层走廊');
      await clickLabel('病历本');
      await clickLabel('护士站', 3800);

      // 证据册
      if (clueBtn) {
        clueBtn.click();
        await sleep(500);
        const rows = document.querySelectorAll('#clueList .row').length;
        rec('✓ 打开证据册，里面 ' + rows + ' 条');
        clueBtn.click();
      }

      // 原地休息
      freeInput.value = '休息';
      await freeAct('休息');
      await sleep(1200);
      rec('✓ 原地休息 → ' + snap());

      rec('=== 通过：' + log.filter((l) => l.indexOf('✓') >= 0).length +
        ' 项，失败：' + log.filter((l) => l.indexOf('✗') >= 0).length + ' 项 ===');

      // 音频状态
      const ac = window.SFX && window.SFX.ctx;
      rec('音频：AudioContext=' + (ac ? ac.state : '无') +
        ' 音乐=' + (window.MUSIC && window.MUSIC.on ? '开' : '关') +
        ' 声线=' + ('speechSynthesis' in window ? (speechSynthesis.getVoices().length + ' 个语音') : '不支持'));
    } catch (e) {
      rec('!!! 抛错：' + e.message + '\n' + (e.stack || '').split('\n')[1]);
    }

    const d = document.createElement('pre');
    d.style.cssText =
      'position:fixed;z-index:9999;left:0;top:0;width:100%;height:100%;' +
      'background:#000;color:#0f0;font:13px/1.7 monospace;padding:14px 18px;' +
      'white-space:pre-wrap;overflow:auto;margin:0';
    d.textContent = log.join('\n');
    document.body.appendChild(d);
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    $('#seedtxt').textContent = SEED;
    $('#lifeName').textContent = LIFE.who.name;
    $('#lifeLine').textContent = LIFE.who.origin + ' · ' + LIFE.who.job + ' · ' + LIFE.who.family;
    $('#wound').textContent = LIFE.who.wound;
    if ($('#stat')) $('#stat').textContent = '十一个场景 · 七十处可碰之物 · 十二枚别人嘴里的真相';

    if (!QS.get('debug')) {
      const keys = Object.keys(STARTS);
      S.scene = keys[window.WorldSeed.fnv(SEED) % keys.length];
    }

    if (TRACE) $('#startHint').textContent = '三号院里还留着上一个人的痕迹';

    $('#begin').addEventListener('click', run);
    // 「再来一次」的绑定交给 finish()，这里不预先绑死

    if (clueBtn && cluePanel) {
      clueBtn.addEventListener('click', (e) => {
        e.preventDefault();
        cluePanel.classList.toggle('on');
      });
    }
    renderClues();

    freeBar.classList.add('on');
    freeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        freeAct(freeInput.value);
      }
    });
    panel.addEventListener('click', () => {
      if (typing) skip = true;
    });

    const setU = () => {
      const w = Math.max(frame.clientWidth || 800, 640);
      frame.style.setProperty('--u', (w / 100).toFixed(3) + 'px');
    };
    setU();
    if (window.ResizeObserver) new ResizeObserver(setU).observe(frame);

    const dbg = QS.get('debug');
    if (dbg && SCENES[dbg]) {
      $('#start').style.display = 'none';
      freeBar.classList.add('on');
      S.scene = dbg;
      renderScene();
    }

    if (QS.has('auto')) setTimeout(run, 200);
    if (QS.get('probe') === '3') {
      setTimeout(() => {
        const d = document.createElement('pre');
        d.style.cssText =
          'position:absolute;z-index:99;left:2%;top:6%;color:#0f0;font:14px monospace;background:#000;padding:10px;white-space:pre-wrap';
        let info = 'hotspots=' + document.querySelectorAll('#hotspots .hs').length + '\n';
        const hs = document.querySelectorAll('#hotspots .hs');
        for (let i = 0; i < hs.length && i < 5; i++) {
          const el = hs[i];
          const r = el.getBoundingClientRect();
          const cx = Math.round(r.left + r.width / 2);
          const cy = Math.round(r.top + r.height / 2);
          const top = document.elementFromPoint(cx, cy);
          info +=
            el.textContent +
            ' @' + cx + ',' + cy +
            ' -> ' + (top ? top.className || top.tagName : 'null') + '\n';
        }
        d.textContent = info;
        frame.appendChild(d);
      }, 1600);
    }
    if (QS.has('skipintro') || QS.has('debug') || QS.has('auto') || QS.has('e2e')) {
      const g = $('#gate');
      if (g) {
        g.style.display = 'none';
        g.classList.add('off');
      }
      $('#start').style.display = QS.has('skipintro') && !QS.has('debug') ? '' : 'none';
      const iv0 = $('#intro');
      if (iv0) {
        iv0.classList.remove('on');
        iv0.style.display = 'none';
      }
    } else {
      // 等一次真实的点击：浏览器只允许在手势之后出声
      const gate = $('#gate');
      const gateBtn = $('#gateBtn');
      if (gateBtn) {
        gateBtn.addEventListener('click', () => {
          gate.classList.add('off');
          setTimeout(() => {
            gate.style.display = 'none';
          }, 900);
          window.SFX.start();
          if (window.MUSIC) window.MUSIC.start();
          setTimeout(playIntro, 500);
        });
      }
    }

    if (QS.has('e2e')) setTimeout(runE2E, 600);

    const sk = $('#introSkip');
    if (sk) sk.addEventListener('click', () => { introSkip = true; });

    probePhotos();
  }

  async function run() {
    // 保险：进场前把开场动画彻底关掉，别让它挡住热区
    const iv = $('#intro');
    if (iv) {
      iv.classList.remove('on');
      iv.style.display = 'none';
    }

    $('#start').classList.add('off');
    window.SFX.start();
    if (window.MUSIC) window.MUSIC.start();
    freeBar.classList.add('on');
    await sleep(400);
    flash.classList.add('on');
    await sleep(1200);
    renderScene();
    flash.classList.remove('on');
    await sleep(700);

    const st = STARTS[S.scene] || STARTS.room;
    await narrate(st.text);

    startClock();
    if ($('#topDay')) $('#topDay').textContent = '第 ' + S.day + ' 天 · ' + PHASE(S.hour) + ' · ' + hm(S.hour);

    if (st.clue && S.clues.indexOf(st.clue) < 0) {
      S.clues.push(st.clue);
      const sec = CITY.SECRETS.find((x) => x.id === st.clue);
      window.SFX.hit('heart');
      await sleep(240);
      await narrate('【线索 ' + S.clues.length + '/12】' + sec.text + '\n—— ' + sec.owner);
    }

    await narrate('这里的一切都能碰。鼠标移过去会显形。\n右上角写着你还剩多少体力。');

    if (QS.has('auto')) autoRun();
  }

  async function autoRun() {
    let guard = 0;
    while (!S.finished && guard++ < 40) {
      const sc = SCENES[S.scene];
      const hs = sc.hotspots[guard % sc.hotspots.length];
      if (!hs) break;
      await act(hs);
      await sleep(60);
    }
    if (!S.finished) await finish();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
